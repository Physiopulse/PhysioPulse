<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PhysioPulse Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>Admin Login</h2>

<div id="loginBox">
  <input type="email" id="email" placeholder="Admin Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button id="loginBtn">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<div id="panel" style="display:none;">
  <h3>Publish Paper</h3>

  <input id="title" placeholder="Title"><br><br>
  <input id="subtitle" placeholder="Subtitle"><br><br>
  <input id="year" placeholder="Year"><br><br>

  <input type="file" id="pdfFile" accept="application/pdf"><br><br>
  <input type="file" id="imgFile" accept="image/*"><br><br>

  <button id="publishBtn">Publish</button>
  <button id="logoutBtn">Logout</button>

  <hr>
  <div id="paperList"></div>
</div>

<!-- LOAD SUPABASE FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- THEN LOAD OUR SCRIPT -->
<script src="admin-publish.js"></script>

</body>
</html>
